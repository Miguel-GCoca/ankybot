policy_runner:
  ros__parameters:
    # Path to the exported ONNX policy. Overridden at launch time by the
    # policy_path launch argument, which defaults to policy/policy.onnx inside
    # the installed package share. Set explicitly if loading from another path:
    #   ros2 launch ankybot_policy_runner policy_runner.launch.py \
    #       policy_path:=/abs/path/to/policy.onnx
    policy_path: ""

    # MUST match training: decimation(10) * sim.dt(0.002) = 0.02s, 50Hz
    control_dt: 0.02

    # exponential smoothing on policy output, 0 = no smoothing, closer to
    # 1 = heavier smoothing. Training itself applies no filter at all, so
    # lower alpha moves deployment closer to what was actually trained.
    # Hardware-tuning value, not independently measured, retune if gait
    # smoothness looks off.
    action_filter_alpha: 0.15

    # hard cap on the goal's slew rate (rad/s), applied after the filter
    # above, a backstop against pathological single-tick jumps (the
    # publish_rate_hz interpolation below handles routine smoothing).
    # Stays under the rated no-load servo speed of ~10.47 rad/s (600 deg/s).
    # Estimate, not measured on hardware, retune if gait amplitude looks
    # short or too close to the servo's real loaded (lower than no-load)
    # max speed.
    max_joint_vel_rad_s: 8.0

    # rate /joint_commands is actually published at (Hz), decoupled from
    # control_dt (which stays 50Hz to match training). A real servo has no
    # compliance like the sim's actuator model, it snaps to whatever
    # position it's told, so publishing the rate-limited goal directly at
    # only 50Hz would read as discrete snaps instead of continuous motion.
    # This timer linearly interpolates between each control tick's old/new
    # goal and publishes smaller, more frequent sub-steps instead. Must be
    # >= 1/control_dt = 50, diminishing returns above the PCA9685's 300Hz
    # PWM carrier frequency; retune on hardware.
    publish_rate_hz: 200.0

    # from ActionsCfg.joint_position (scale=0.4)
    action_scale: 0.4
    action_clip: 1.4923

    # joint order MUST match PhysX articulation: type-first, alphabetical by leg
    # [BL,BR,FL,FR]_Hip, [BL,BR,FL,FR]_Thigh, [BL,BR,FL,FR]_Foot
    joint_names:
      - BL_Hip_Joint
      - BR_Hip_Joint
      - FL_Hip_Joint
      - FR_Hip_Joint
      - BL_Thigh_Joint
      - BR_Thigh_Joint
      - FL_Thigh_Joint
      - FR_Thigh_Joint
      - BL_Foot_Joint
      - BR_Foot_Joint
      - FL_Foot_Joint
      - FR_Foot_Joint

    # absolute default joint positions (rad) matching init_state in training.
    # hip=0.0, thigh=+0.5236 (~30deg), foot=+0.5236 (~30deg). Always
    # cross-check against the specific deployed checkpoint's own
    # params/env.yaml, never against ankybot_v3.py's current live value,
    # while pose experiments are ongoing.
    default_joint_pos_rad:
      [0.0, 0.0, 0.0, 0.0,
       0.5236, 0.5236, 0.5236, 0.5236,
       0.5236, 0.5236, 0.5236, 0.5236]

    # topics
    imu_topic: "/imu/data"
    cmd_vel_topic: "/cmd_vel"
    joint_states_topic: "/joint_states"
    servo_cmd_topic: "/joint_commands"

    # if no /cmd_vel received within this many seconds, command zero velocity
    cmd_vel_timeout: 1.0
