        - 0.0
        - 0.0
        - 0.0
        rot:
        - 0.0
        - 0.0
        - 0.0
        - 1.0
      collision_group: 0
      debug_vis: false
    contact_forces:
      class_type: isaaclab.sensors.contact_sensor.contact_sensor:ContactSensor
      prim_path: '{ENV_REGEX_NS}/Robot/FinalURDF_SLDASM/.*'
      update_period: 0.002
      debug_vis: false
      track_pose: false
      track_contact_points: false
      track_friction_forces: false
