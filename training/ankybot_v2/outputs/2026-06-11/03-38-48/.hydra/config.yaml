        - 0.0
        - 0.0
        - 0.25
        rot:
        - 0.0
        - 0.0
        - 0.0
        - 1.0
        lin_vel:
        - 0.0
        - 0.0
        - 0.0
        ang_vel:
        - 0.0
        - 0.0
        - 0.0
