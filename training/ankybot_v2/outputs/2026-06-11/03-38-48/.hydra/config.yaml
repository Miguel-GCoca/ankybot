          - .*_Thigh_Joint
          - .*_Foot_Joint
          effort_limit: 3.92266
          velocity_limit: 10.4719755
          effort_limit_sim: 3.92266
          velocity_limit_sim: 10.4719755
          stiffness:
            .*_Hip_Joint: 20.0
            .*_Thigh_Joint: 20.0
            .*_Foot_Joint: 18.0
          damping:
            .*_Hip_Joint: 0.8
            .*_Thigh_Joint: 0.8
            .*_Foot_Joint: 0.8
          armature: null
          friction: null
          dynamic_friction: null
          viscous_friction: null
